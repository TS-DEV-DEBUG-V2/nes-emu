<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NES Emulator</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#1a1a2e;
    color:#e0e0e0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:20px
}
h1{font-size:1.5em;margin-bottom:10px;color:#fff}
#status{
    color:#aaa;
    margin:5px 0 12px;
    font-size:14px;
    text-align:center
}
#canvas-wrap{
    background:#000;
    border:3px solid #333;
    border-radius:8px;
    overflow:hidden;
    margin:10px 0
}
canvas{
    display:block;
    image-rendering:pixelated
}
.controls{
    display:flex;
    gap:10px;
    margin:10px 0;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center
}
.file-label,button,select{
    background:#16213e;
    color:#e0e0e0;
    border:2px solid #0f3460;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px
}
.file-label:hover,button:hover,select:hover{background:#0f3460}
.file-label input{display:none}
.info{
    max-width:768px;
    text-align:center;
    font-size:13px;
    color:#888;
    margin-top:10px;
    line-height:1.6
}
kbd{
    background:#333;
    padding:2px 6px;
    border-radius:3px;
    font-size:12px
}
</style>
</head>

<body>

<h1>NES Emulator</h1>

<div id="status">Drag your ROM here or pick one below</div>

<div id="canvas-wrap">
    <canvas id="canvas" width="768" height="720"
        oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>

<div class="controls">

    <label class="file-label">
        Load ROM
        <input type="file" id="rom-input" accept=".nes">
    </label>

    <select id="rom-select">
        <option value="">Select built-in ROM</option>
        <option value="./roms/test.nes">Accuracy Test</option>
        <option value="./roms/rom.nes">Super Mario Bros.</option>
        <option value="./roms/rom3.nes">Super Mario Bros. 2</option>
        <option value="./roms/rom2.nes">Super Mario Bros. 3</option>
        <option value="./roms/paper.nes">Paperboy</option>
    </select>

    <button id="load-selected">Load</button>
</div>

<div class="info">
<strong>Controls:</strong><br>
DPAD → Arrow Keys &nbsp;
A → Z &nbsp;
B → X &nbsp;
START → ENTER &nbsp;
SELECT → RSHIFT
</div>

<script>
var Module = {
    canvas: document.getElementById("canvas"),
    onRuntimeInitialized: function () {
        document.getElementById("status").textContent =
            "Ready — choose or drop a ROM";
    }
};

function loadROMFile(file, name) {
    var reader = new FileReader();

    reader.onload = function (ev) {
        var data = new Uint8Array(ev.target.result);

        var ptr = Module._malloc(data.length);
        Module.HEAPU8.set(data, ptr);

        Module._load_rom_from_data(ptr, data.length);

        Module._free(ptr);

        document.getElementById("status").textContent =
            "Playing: " + name;
    };

    reader.readAsArrayBuffer(file);
}

// file picker
document.getElementById("rom-input").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    loadROMFile(file, file.name);
});

// drag & drop
document.getElementById("canvas").addEventListener("dragover", function (e) {
    e.preventDefault();
});

document.getElementById("canvas").addEventListener("drop", function (e) {
    e.preventDefault();
    var file = e.dataTransfer.files[0];
    if (!file) return;
    loadROMFile(file, file.name);
});

// built-in ROM loader
document.getElementById("load-selected").onclick = function () {
    var path = document.getElementById("rom-select").value;
    if (!path) return;

    console.log("Loading ROM from:", new URL(path, window.location.href).href);

    fetch(path)
        .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.arrayBuffer();
        })
        .then(function (buf) {
            var data = new Uint8Array(buf);

            var ptr = Module._malloc(data.length);
            Module.HEAPU8.set(data, ptr);

            Module._load_rom_from_data(ptr, data.length);

            Module._free(ptr);

            document.getElementById("status").textContent =
                "Playing: " + path;
        })
        .catch(function (err) {
            console.error(err);
            document.getElementById("status").textContent =
                "Failed to load: " + path;
        });
};
</script>

<script async src="nesemu.js"></script>

</body>
</html>
