<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>NES Emulator</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5em;margin-bottom:10px;color:#fff}#canvas-wrap{background:#000;border:3px solid #333;border-radius:8px;overflow:hidden;margin:10px 0}canvas{display:block;image-rendering:pixelated}.controls{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center}.file-label,button{background:#16213e;color:#e0e0e0;border:2px solid #0f3460;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;transition:background .2s}.file-label:hover,button:hover{background:#0f3460}.file-label input{display:none}.info{max-width:768px;text-align:center;font-size:13px;color:#888;margin-top:10px;line-height:1.6}kbd{background:#333;padding:2px 6px;border-radius:3px;font-size:12px}#status{color:#aaa;margin:5px 0;font-size:14px}</style></head><body><h1>NES Emulator</h1><div id=status>Drop a .nes ROM on the screen or click Load ROM</div><div id=canvas-wrap><canvas height=720 id=canvas oncontextmenu=event.preventDefault() tabindex=-1 width=768></canvas></div><div class=controls><label class=file-label>Load ROM <input accept=.nes id=rom-input type=file></label> <button onclick='Module._load_rom_from_url&&Module._load_rom_from_url(prompt("Enter ROM URL:"))'>Load URL</button></div><div class=info><strong>Controls:</strong> <kbd>Arrow Keys</kbd> D-Pad   <kbd>Z</kbd>/<kbd>X</kbd> A   <kbd>A</kbd>/<kbd>S</kbd> B   <kbd>Enter</kbd> Start   <kbd>RShift</kbd> Select   <kbd>Ctrl+R</kbd> Reset</div><script>var Module={canvas:document.getElementById("canvas"),onRuntimeInitialized:function(){document.getElementById("status").textContent="Ready - load a ROM to begin"}};document.getElementById("rom-input").addEventListener("change",(function(e){var t=e.target.files[0];if(t){var n=new FileReader;n.onload=function(e){var n=new Uint8Array(e.target.result),a=Module._malloc(n.length);Module.HEAPU8.set(n,a),Module._load_rom_from_data(a,n.length),Module._free(a),document.getElementById("status").textContent="Playing: "+t.name},n.readAsArrayBuffer(t)}})),document.getElementById("canvas").addEventListener("dragover",(function(e){e.preventDefault()})),document.getElementById("canvas").addEventListener("drop",(function(e){e.preventDefault();var t=e.dataTransfer.files[0];if(t){var n=new FileReader;n.onload=function(e){var n=new Uint8Array(e.target.result),a=Module._malloc(n.length);Module.HEAPU8.set(n,a),Module._load_rom_from_data(a,n.length),Module._free(a),document.getElementById("status").textContent="Playing: "+t.name},n.readAsArrayBuffer(t)}}))</script><script async src=nesemu.js></script></body></html>
