<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>NES Emulator</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{font-size:1.5em;margin-bottom:10px;color:#fff}#status{color:#aaa;margin:5px 0 12px;font-size:14px;text-align:center}#canvas-wrap{background:#000;border:3px solid #333;border-radius:8px;overflow:hidden;margin:10px 0}canvas{display:block;image-rendering:pixelated}.controls{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;justify-content:center;align-items:center}.file-label,button,select{background:#16213e;color:#e0e0e0;border:2px solid #0f3460;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px}.file-label:hover,button:hover,select:hover{background:#0f3460}.file-label input{display:none}.info{max-width:768px;text-align:center;font-size:13px;color:#888;margin-top:10px;line-height:1.6}kbd{background:#333;padding:2px 6px;border-radius:3px;font-size:12px}</style></head><body><h1>NES Emulator</h1><div id=status>Drag your ROM here or pick one below</div><div id=canvas-wrap><canvas height=720 id=canvas oncontextmenu=event.preventDefault() tabindex=-1 width=768></canvas></div><div class=controls><label class=file-label>Load ROM <input accept=.nes id=rom-input type=file></label> <select id=rom-select><option value="">Select built-in ROM</option><option value=./roms/test.nes>Accuracy Test</option><option value=./roms/rom.nes>Super Mario Bros.</option><option value=./roms/rom3.nes>Super Mario Bros. 2</option><option value=./roms/rom2.nes>Super Mario Bros. 3</option><option value=./roms/paper.nes>Paperboy</option></select> <button id=load-selected>Load</button></div><div class=info><strong>Controls:</strong><br>DPAD → Arrow Keys   A → Z   B → X   START → ENTER   SELECT → RSHIFT</div><script>var Module={canvas:document.getElementById("canvas"),onRuntimeInitialized:function(){document.getElementById("status").textContent="Ready, plz choose or drop a rom"}};function loadROMFile(e,t){var n=new FileReader;n.onload=function(e){var n=new Uint8Array(e.target.result),a=Module._malloc(n.length);Module.HEAPU8.set(n,a),Module._load_rom_from_data(a,n.length),Module._free(a),document.getElementById("status").textContent="Playing: "+t},n.readAsArrayBuffer(e)}document.getElementById("rom-input").addEventListener("change",(function(e){var t=e.target.files[0];t&&loadROMFile(t,t.name)})),document.getElementById("canvas").addEventListener("dragover",(e=>e.preventDefault())),document.getElementById("canvas").addEventListener("drop",(function(e){e.preventDefault();var t=e.dataTransfer.files[0];t&&loadROMFile(t,t.name)})),document.getElementById("load-selected").onclick=function(){var e=document.getElementById("rom-select").value;e&&fetch(e).then((e=>e.arrayBuffer())).then((t=>{var n=new Uint8Array(t),a=Module._malloc(n.length);Module.HEAPU8.set(n,a),Module._load_rom_from_data(a,n.length),Module._free(a),document.getElementById("status").textContent="playing = "+e})).catch((()=>{document.getElementById("status").textContent="failed to load: "+e}))}</script><script async src=nesemu.js></script></body></html>
